[project]
name = "coinmonitorsuite"
version = "0.1.0"
description = "Greenfield crypto backtesting + (later) automated trading on Bybit candles"
requires-python = ">=3.12"
dependencies = [
    "ccxt",
    "pandas",
    "numpy",
    "pyarrow",
    "pydantic-settings",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
plots = ["matplotlib"]
viewer = ["streamlit", "plotly"]

[project.scripts]
coinmon = "coinmon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coinmon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
